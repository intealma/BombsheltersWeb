<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dissolve</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #090b0f;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
  }

  .stage {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
  }

  #ascii {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(6px, 0.9vw, 11px);
    line-height: 1.15;
    letter-spacing: 0;
    color: #cfd8e3;
    white-space: pre;
    text-align: left;
    user-select: none;
  }

  .caption {
    position: absolute;
    bottom: 8%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #4b5563;
    opacity: 0;
    transition: opacity 0.6s ease;
    white-space: nowrap;
  }

  .mark {
    position: absolute;
    top: 6%;
    left: 6%;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: #35404d;
    text-transform: uppercase;
  }

  .mark span {
    color: #5fd0ff;
  }
</style>
</head>
<body>

  <div class="stage">
    <div class="mark">tiger<span>.</span>ascii</div>
    <pre id="ascii"></pre>
    <div class="caption" id="caption">everything, eventually, turns to space</div>
  </div>

<script>
const RAW = `                                                                            *#%=       :##+         
                                .=##%%+==+%%#+**#%%****%%####%%%#*+===---:-=....:=##-.=....+:       
                            -##*...-##:...**=...=**....**=...=**....*#=...+**#############==        
                          *..=**+:.-##:...*#=...=**....**=...+**....*#-..*  .....+##-.....  =       
                        *#-..*#%...:**:...**=...=**....**=...+**....*#=..*- ...*@-**.*#...  .-      
                      .+#*=+: :#...:**:...**=...-**....**=...+**....*#=.%   .....--.+....  .*       
                     =.:##-   %#...:**:...**=...=#*....**=...+**....*#-.-=   ....+:.+...     %      
                    *..:*    -#*...-#*:...**=...-**....**=...=**....**-..+   .....+@:...    =.      
                   %*.-:     %#*...-**:...**=...-**....**=...=**....*#-..*-..  +--**+---  . -       
                  #**=      +=#*...:*#-+..**=...-**....**=...=**....##-..+.=*--*      -.--+         
    :=#+        .--*#      *.=##...-*#=*--===*##%++====+++=-=+#+#%:.*#-...*:    ==++++-             
   =:-:        =:.=#     =-..=#*...:*   :=...+#+.+           #..+#%+*#-...:%*                       
   +.:+      :%*..=  :+###...=#*.:+.      =..=*+..+         #...+#*%##-...:##*.                     
   .=..=*=+=-=#*+.  +..*#*...=%*:          :-=*+..=        %*...+*%  -+...:##.:+                    
     +:.=*+..-%:    :=.*#*==                +=*+..+       #**...+%.   .*..:##...#                   
       .-=-:.        =.*#*.=.               +=*+..+      *=**...#:      +-:**....#=                 
                      %##*.....+            +=*+...:::+:#:-**..:+=*      :%##....*#+::-+            
                       #**......+            #*+.......-#.-**......*       ##....*#-....*           
                        #**+++++.             =*+======: :+++=====-         :=======----`;

const asciiEl = document.getElementById('ascii');
const captionEl = document.getElementById('caption');

const lines = RAW.split('\n');
const width = Math.max(...lines.map(l => l.length));
const padded = lines.map(l => l.padEnd(width, ' '));
const rows = padded.length;

const thresholds = padded.map((row, r) =>
  row.split('').map((ch, c) => {
    if (ch === ' ') return -1;
    const wind = (c / width) + (r / rows) * 0.25;
    const jitter = (Math.sin(r * 12.9898 + c * 78.233) * 43758.5453) % 1;
    const jitterAbs = Math.abs(jitter) * 0.35;
    return wind * 0.75 + jitterAbs;
  })
);

const erodeChars = ['.', ':', '·', "'", ','];

function render(progress) {
  let out = '';
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < width; c++) {
      const ch = padded[r][c];
      const th = thresholds[r][c];
      if (th < 0) { out += ' '; continue; }
      const dist = th - progress;
      if (dist < 0) {
        out += ' ';
      } else if (dist < 0.05) {
        const idx = Math.floor((r * width + c + Math.floor(progress * 97)) % erodeChars.length);
        out += erodeChars[idx];
      } else {
        out += ch;
      }
    }
    out += '\n';
  }
  asciiEl.textContent = out;
}

function easeInOutSine(x) {
  return -(Math.cos(Math.PI * x) - 1) / 2;
}

const HOLD_FULL = 1400;
const DISSOLVE = 5200;

let start = performance.now();
let done = false;

function frame(now) {
  const t = now - start;

  if (t < HOLD_FULL) {
    render(0);
    captionEl.style.opacity = 0;
  } else if (t < HOLD_FULL + DISSOLVE) {
    const local = (t - HOLD_FULL) / DISSOLVE;
    render(easeInOutSine(local) * 1.05);
    captionEl.style.opacity = String(Math.min(local * 1.4, 1));
  } else if (!done) {
    render(1.05);
    captionEl.style.opacity = 1;
    done = true;
  }

  if (!done) requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>

</body>
</html>
